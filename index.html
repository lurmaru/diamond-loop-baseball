<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#183d34">
  <meta name="description" content="青葉高校野球部を率いて夏の頂点へ。練習カードと試合采配で何世代も育てる高校野球ローグライト。">
  <title>ダイヤモンドループ｜高校野球育成ローグライト</title>
  <link rel="icon" href="./assets/ball.svg">
  <link rel="stylesheet" href="./scorebook.css?v=4">
  <script defer src="./cards.js?v=4"></script>
  <script defer src="./engine.js?v=4"></script>
  <script defer src="./game.js?v=4"></script>
</head>
<body>
  <header><div class="top wrap">
    <button id="brand" class="brand" aria-label="育成ホーム"><img src="./assets/ball.svg" alt=""><span>Diamond Loop<small>ダイヤモンドループ</small></span></button>
    <nav id="nav" aria-label="メインメニュー"></nav>
    <div class="top-tools"><span class="save" id="save">自動保存</span><button id="settings" class="icon-btn" aria-label="設定と遊び方"></button></div>
  </div></header>
  <main id="main" class="wrap"></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="modal" aria-labelledby="modal-title"><div id="modal-body"></div></dialog>
  <noscript>遊ぶにはブラウザの JavaScript を有効にしてください。</noscript>
</body>
</html>
